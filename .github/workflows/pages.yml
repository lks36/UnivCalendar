name: Sync calendar and deploy

on:
  schedule:
    # UTC 时间 5点和11点，对应巴黎时间大约早7点/13点（冬夏令时会有1小时误差，够用了）
    - cron: '0 5,11 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'selection.json'
      - 'docs/**'
      - '.github/workflows/sync.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发写 Pages
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build calendar (fetch CalDAV + filter + generate .ics/.json)
        run: python3 ci_build.py
        env:
          # 默认是学校公开的访客凭证，如果学校后续改了，在仓库 Settings > Secrets
          # 里加同名 Secret 覆盖即可，不用改代码
          CALDAV_USERNAME: ${{ secrets.CALDAV_USERNAME }}
          CALDAV_PASSWORD: ${{ secrets.CALDAV_PASSWORD }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
