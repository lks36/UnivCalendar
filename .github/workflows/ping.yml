name: Keep awake and refresh

on:
  schedule:
    - cron: '*/14 * * * *'    # 每14分钟：只是访问一下首页，防止休眠
    - cron: '0 5,11 * * *'    # 每天两次（巴黎时间约7点/13点）：更新课表
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep awake
        if: github.event.schedule != '0 5,11 * * *'
        run: curl -sS -o /dev/null "${{ secrets.APP_URL }}/" || true

      - name: Refresh courses
        if: github.event.schedule == '0 5,11 * * *' || github.event_name == 'workflow_dispatch'
        run: curl -sS -X POST "${{ secrets.APP_URL }}/api/sync" || true